[project]
name = "finops-agent"
version = "0.1.0"
description = "FinOps 云成本治理智能体：来源、身份、只读查询、预算、结果、异常工单、恢复与冻结评测的受控系统。"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
server = ["uvicorn>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:starlette.testclient",
  "ignore::DeprecationWarning",
]