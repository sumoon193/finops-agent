services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finops
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops_local
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops -d finops"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - finops-postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      FINOPS_DATABASE_URL: postgresql://finops:finops_local@postgres:5432/finops
      FINOPS_IDENTITY_MODE: signed
      FINOPS_IDENTITY_SECRET: ${FINOPS_IDENTITY_SECRET:-finops_local_identity_only_change_me}
      FINOPS_AGENT_MODE: ${FINOPS_AGENT_MODE:-offline}
      FINOPS_TICKET_ADAPTER: ${FINOPS_TICKET_ADAPTER:-offline}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_CHAT_MODEL: ${QWEN_CHAT_MODEL:-qwen-plus}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  finops-postgres-data:
